<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Loja PWA</title>

  <!-- CSS do Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

  <!-- Axios -->
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <!-- Manifesto do aplicativo -->
  <link rel="manifest" href="./manifest.json">
</head>

<body class="bg-light">

  <!-- Barra de navegação -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary fixed-top">
    <div class="container-fluid">

      <button
        type="button"
        class="navbar-brand btn"
        onclick="carregarPorCategoria('todos')">
        Minha Loja
      </button>

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarNav"
        aria-controls="navbarNav"
        aria-expanded="false"
        aria-label="Abrir menu">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Itens do menu -->
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">

          <li class="nav-item">
            <a
              class="nav-link"
              href="#"
              onclick="carregarPorCategoria('men\'s clothing'); return false;">
              Vestuário
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#"
              onclick="carregarPorCategoria('electronics'); return false;">
              Eletrônicos
            </a>
          </li>

          <li class="nav-item">
            <a
              class="nav-link"
              href="#"
              onclick="carregarPorCategoria('jewelery'); return false;">
              Acessórios
            </a>
          </li>

          <li class="nav-item">
            <button
              type="button"
              class="nav-link"
              onclick="navegar('tela-contato')">
              Contato
            </button>
          </li>

          <li id="installAppBt" class="nav-item collapse">
            <a
              class="nav-link"
              href="#"
              onclick="installApp(); return false;">
              Instalar APP
            </a>
          </li>

        </ul>
      </div>

    </div>
  </nav>

  <!-- Conteúdo principal -->
  <div class="container py-4 mt-5">
    <h1 class="text-center mb-4">
      PWA Loja SPA com Web Service
    </h1>

    <!-- Lista de produtos -->
    <div
      id="tela-home"
      class="tela row row-cols-1 row-cols-md-3 g-4 show">
    </div>

    <!-- Contato -->
   <div
  id="tela-home"
  class="tela row row-cols-1 row-cols-md-3 g-4 show">
</div>

        <p><strong>Endereço:</strong> Rua Exemplo, 123 - Centro</p>
        <p><strong>Cidade:</strong> Florianópolis - SC</p>
        <p><strong>Telefone:</strong> (48) 99999-0000</p>
        <p><strong>Email:</strong> contato@minhaloja.com</p>

        <button
          type="button"
          class="btn btn-secondary mt-3"
          onclick="voltar()">
          ← Voltar
        </button>
      </div>
    </div>

    <!-- Detalhes do produto -->
    <div id="tela-produto" class="tela collapse">
      <button
        type="button"
        class="btn btn-secondary mb-3"
        onclick="voltar()">
        ← Voltar
      </button>

      <div id="detalhes-produto" class="card shadow p-3"></div>
    </div>

  </div>

  <!-- JavaScript do Bootstrap -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- JavaScript do projeto -->
  <script src="./script.js"></script>

</body>
</html>
